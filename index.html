<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon-192.png"><title>Padel Voice Score</title>
<style>
:root{--red:#e53935;--blue:#1976d2;--green:#22c55e;--bg:#07111f;--panel:#111c2d;--key:#334155}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;background:var(--bg);color:#fff;font-family:Arial,sans-serif;text-align:center;padding:clamp(8px,2vw,18px)}h1{font-size:clamp(22px,4vw,40px);color:var(--green);margin:6px}.status{min-height:28px;color:#4ade80;font-weight:700}.teams,.touch,.serve{display:grid;grid-template-columns:1fr 1fr;gap:clamp(6px,1.5vw,14px);max-width:1100px;margin:8px auto}.team{padding:10px;border-radius:14px;font-weight:900;font-size:clamp(18px,4vw,38px)}.red{background:var(--red)}.blue{background:var(--blue)}.dot{display:inline-block;width:clamp(12px,2.5vw,22px);height:clamp(12px,2.5vw,22px);border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);margin-left:8px}.hidden{visibility:hidden}.summary{font-size:clamp(22px,5vw,44px);margin:5px}.score{display:flex;justify-content:center;align-items:center;gap:5vw;font-size:clamp(72px,20vw,210px);font-weight:900;line-height:1;margin:12px}.redText{color:var(--red)}.blueText{color:var(--blue)}button{border:0;border-radius:12px;color:#fff;font-weight:800;padding:12px;min-height:54px;font-size:clamp(15px,3vw,22px);background:var(--key);transition:.1s}.redBtn{background:var(--red)}.blueBtn{background:var(--blue)}.greenBtn{background:#166534}.pressed{transform:scale(.94);filter:brightness(1.35)}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:1100px;margin:auto}.history{max-width:1100px;margin:12px auto;padding:10px;background:var(--panel);border-radius:12px;overflow:auto;max-height:320px}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:8px;border-bottom:1px solid #334155;white-space:nowrap}th{background:#1e293b;position:sticky;top:0}.fs{display:none}.fullscreen body{padding:0;overflow:hidden}.fullscreen body>*:not(.fs){display:none!important}.fullscreen .fs{display:grid;width:100vw;height:100dvh;grid-template-rows:12dvh 12dvh 12dvh 1fr;background:#020617;padding:1.5dvh 2vw}.fsTeams{display:flex;justify-content:space-around;align-items:center;font-size:min(5vw,7dvh);font-weight:900}.fsInfo{display:flex;justify-content:center;align-items:center;font-size:min(7vw,10dvh);font-weight:900}.fsPoints{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:2vw;font-size:min(27vw,45dvh);font-weight:900;min-height:0}.fsRed,.fsBlue{height:100%;min-height:0;display:flex;align-items:center;justify-content:center;border-radius:3vw}.fsRed{background:var(--red)}.fsBlue{background:var(--blue)}dialog{background:#111c2d;color:#fff;border:1px solid #64748b;border-radius:16px;max-width:650px;width:92%;text-align:left}dialog li{margin:10px 0}@media(max-height:520px){h1{display:none}.score{font-size:min(21vw,32vh);margin:3px}.summary{font-size:5vh;margin:1px}.history{max-height:110px}.team{padding:5px}.controls button{min-height:40px;padding:7px}}@media(min-width:900px){body{padding-left:5vw;padding-right:5vw}}
</style></head><body>
<h1>🎾 Padel Voice Score</h1><div id="status" class="status">Sprachsteuerung ist aus</div>
<div class="teams"><div class="team red">TEAM ROT <span id="dotR" class="dot"></span></div><div class="team blue">TEAM BLAU <span id="dotB" class="dot hidden"></span></div></div>
<div id="sets" class="summary"></div><div id="games" class="summary"></div><div class="score"><span id="pR" class="redText"></span><span>:</span><span id="pB" class="blueText"></span></div>
<div class="touch"><button class="redBtn" onclick="point('r',this)">+ Punkt Rot</button><button class="blueBtn" onclick="point('b',this)">+ Punkt Blau</button></div>
<div class="serve"><button class="greenBtn" onclick="setServe('r',this)">Aufschlag Rot</button><button class="greenBtn" onclick="setServe('b',this)">Aufschlag Blau</button></div>
<div class="controls"><button id="voiceBtn" onclick="toggleVoice(this)">🎤 Sprache EIN</button><button onclick="undo(this)">↩ Rückgängig</button><button onclick="resetMatch(this)">🔄 Neues Match</button><button onclick="full(this)">📺 Großanzeige</button><button onclick="help.showModal()">❓ Sprachbefehle</button></div>
<div class="history"><h2>Historie</h2><table><thead><tr><th>Zeit</th><th>Aktion</th><th>Rot</th><th>Blau</th><th>Spiele</th><th>Sätze</th></tr></thead><tbody id="hist"></tbody></table></div>
<div class="fs"><div class="fsTeams"><span>TEAM ROT <span id="fdR" class="dot"></span></span><span>TEAM BLAU <span id="fdB" class="dot hidden"></span></span></div><div id="fSets" class="fsInfo"></div><div id="fGames" class="fsInfo"></div><div class="fsPoints"><div id="fpR" class="fsRed"></div><span>:</span><div id="fpB" class="fsBlue"></div></div></div>
<dialog id="help"><h2>Sprachbefehle</h2><ul><li>Punkt Rot / Rot</li><li>Punkt Blau / Blau</li><li>Zurück / Rückgängig</li><li>Spielstand</li><li>Aufschlag Rot / Service Rot</li><li>Aufschlag Blau / Service Blau</li></ul><button onclick="help.close()">Schließen</button></dialog>
<script>
let s=JSON.parse(localStorage.getItem('state')||'null')||{pr:0,pb:0,gr:0,gb:0,sr:0,sb:0};let serve=localStorage.getItem('serve')||'r',stack=[],history=JSON.parse(localStorage.getItem('history')||'[]'),rec=null,listening=false,restartTimer=null,wakeLock=null;
function lab(p,o){if(p>=3&&o>=3){if(p===o)return'40';if(p===o+1)return'Vorteil';return'40'}return['0','15','30','40'][Math.min(3,p)]}
function save(){localStorage.setItem('state',JSON.stringify(s));localStorage.setItem('serve',serve);localStorage.setItem('history',JSON.stringify(history))}
function render(){let r=lab(s.pr,s.pb),b=lab(s.pb,s.pr);pR.textContent=fpR.textContent=r;pB.textContent=fpB.textContent=b;sets.textContent='Sätze '+s.sr+' : '+s.sb;games.textContent='Spiele '+s.gr+' : '+s.gb;fSets.textContent='SÄTZE  '+s.sr+' : '+s.sb;fGames.textContent='SPIELE  '+s.gr+' : '+s.gb;dotR.classList.toggle('hidden',serve!=='r');dotB.classList.toggle('hidden',serve!=='b');fdR.classList.toggle('hidden',serve!=='r');fdB.classList.toggle('hidden',serve!=='b');hist.innerHTML=history.length?history.map(x=>`<tr><td>${x.t}</td><td>${x.a}</td><td>${x.r}</td><td>${x.b}</td><td>${x.g}</td><td>${x.s}</td></tr>`).join(''):'<tr><td colspan="6">Noch keine Einträge</td></tr>';save()}
function feedback(btn){if(!btn)return;btn.classList.add('pressed');setTimeout(()=>btn.classList.remove('pressed'),180);navigator.vibrate?.(30)}
function add(a){history.unshift({t:new Date().toLocaleTimeString('de-DE'),a,r:lab(s.pr,s.pb),b:lab(s.pb,s.pr),g:s.gr+':'+s.gb,s:s.sr+':'+s.sb});history=history.slice(0,150)}
function point(t,btn){stack.push(JSON.stringify({s,serve}));t==='r'?s.pr++:s.pb++;serve=serve==='r'?'b':'r';if((s.pr>=4||s.pb>=4)&&Math.abs(s.pr-s.pb)>=2){s.pr>s.pb?s.gr++:s.gb++;s.pr=s.pb=0;if((s.gr>=6||s.gb>=6)&&Math.abs(s.gr-s.gb)>=2){s.gr>s.gb?s.sr++:s.sb++;s.gr=s.gb=0}}add(t==='r'?'Punkt Rot':'Punkt Blau');feedback(btn);render()}
function undo(btn){if(stack.length){let x=JSON.parse(stack.pop());s=x.s;serve=x.serve;add('Rückgängig');feedback(btn);render()}}
function resetMatch(btn){if(confirm('Neues Match starten?')){s={pr:0,pb:0,gr:0,gb:0,sr:0,sb:0};serve='r';history=[];stack=[];feedback(btn);render()}}
function setServe(t,btn){serve=t;add('Aufschlag '+(t==='r'?'Rot':'Blau'));feedback(btn);render()}
async function keepAwake(){try{if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
async function full(btn){feedback(btn);await keepAwake();document.documentElement.classList.add('fullscreen');try{await document.documentElement.requestFullscreen?.();await screen.orientation?.lock?.('landscape')}catch(e){}}
function exitFull(){document.documentElement.classList.remove('fullscreen')}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)exitFull()});document.addEventListener('dblclick',()=>{if(document.documentElement.classList.contains('fullscreen'))document.exitFullscreen?.()});
function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='de-DE';speechSynthesis.speak(u)}
function command(t){status.textContent='Erkannt: '+t;let x=t.toLowerCase().trim();if(x.includes('punkt rot')||x==='rot')point('r');else if(x.includes('punkt blau')||x==='blau')point('b');else if(x.includes('zurück')||x.includes('rückgängig'))undo();else if((x.includes('aufschlag')||x.includes('service'))&&x.includes('rot'))setServe('r');else if((x.includes('aufschlag')||x.includes('service'))&&x.includes('blau'))setServe('b');else if(x.includes('spielstand'))speak('Punkte Rot '+lab(s.pr,s.pb)+' zu Blau '+lab(s.pb,s.pr)+'. Spiele '+s.gr+' zu '+s.gb+'. Sätze '+s.sr+' zu '+s.sb)}
function createRec(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;let r=new SR();r.lang='de-DE';r.continuous=false;r.interimResults=false;r.maxAlternatives=3;r.onresult=e=>command(e.results[e.results.length-1][0].transcript);r.onend=()=>{if(listening)restartTimer=setTimeout(startRec,650)};r.onerror=e=>{status.textContent='Sprachstatus: '+e.error;if(e.error==='not-allowed'||e.error==='service-not-allowed'){listening=false;voiceBtn.textContent='🎤 Sprache EIN'}};return r}
function startRec(){if(!listening)return;if(!rec)rec=createRec();if(!rec){alert('Dieser Browser unterstützt SpeechRecognition nicht. Bitte aktuelles Chrome verwenden.');listening=false;return}try{rec.start()}catch(e){restartTimer=setTimeout(startRec,900)}}
async function toggleVoice(btn){feedback(btn);await keepAwake();if(listening){listening=false;clearTimeout(restartTimer);rec?.abort();btn.textContent='🎤 Sprache EIN';status.textContent='Sprachsteuerung ist aus'}else{listening=true;btn.textContent='🔴 Sprache AUS';status.textContent='🎤 Sprachsteuerung aktiv';startRec()}}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));render();
</script></body></html>
